# Default ZeroDOM surface rules. Deterministic, client-side only — flags what
# the parsed interaction graph reveals, never sends a request. Point --rules at
# your own file to override. Match keys: type/role/input_type (exact),
# *_regex (label/href/selector/value/placeholder), has/missing (attr lists),
# and page.present_hidden_regex / page.missing_hidden_regex (CSRF-token gates).
rules:
  - id: sensitive-field-name
    severity: high
    description: Input labelled like a secret — exposed to the client where it can be read or tampered with.
    match:
      type: input
      label_regex: "api[_-]?key|secret|access[_-]?token|private[_-]?key|client[_-]?secret|\\bpassword\\b|\\bpwd\\b"

  - id: prefilled-credential
    severity: high
    description: A field arrives with a non-empty value that looks like a credential — a leaked default or session secret in the DOM.
    match:
      type: input
      label_regex: "token|secret|key|password"
      has: [value]

  - id: exposed-admin-link
    severity: medium
    description: Link into an admin / internal / debug surface reachable from this page.
    match:
      href_regex: "/(admin|internal|_debug|debug|actuator|swagger|graphql|phpmyadmin|\\.git)(/|$|\\?)"

  # Retired: "fillable field + no CSRF token" fired on every search/newsletter box
  # — noise. The real CSRF signal is the `csrf-posture` correlation (a cookie-
  # authenticated POST surface with no SameSite and no token), emitted by `scan`;
  # the precise password-form case below is kept.

  - id: password-field-outside-form-token
    severity: medium
    description: Password input on a page carrying no anti-forgery hidden field — credential POST likely unprotected.
    match:
      type: input
      input_type: password
    page:
      missing_hidden_regex: "csrf|xsrf|authenticity_token|__requestverificationtoken"

# Response-header posture rules (judge the HTTP response, not the DOM). Each
# names a header (case-insensitive) and exactly one condition: absent / present /
# value_regex / value_missing_regex.
header_rules:
  - id: missing-csp
    severity: medium
    description: No Content-Security-Policy response header — a client-side injection is unconstrained.
    header: content-security-policy
    absent: true

  - id: csp-unsafe-inline
    severity: medium
    description: CSP allows 'unsafe-inline' — inline scripts/handlers run, so it is weak against XSS.
    header: content-security-policy
    value_regex: "unsafe-inline"

  - id: cors-wildcard-origin
    severity: medium
    description: Access-Control-Allow-Origin is '*' — any origin may read responses from this surface.
    header: access-control-allow-origin
    value_regex: "^\\*$"

  - id: cookie-without-samesite
    severity: low
    description: Set-Cookie without SameSite — the cookie rides cross-site requests (CSRF exposure).
    header: set-cookie
    value_missing_regex: "samesite"

  - id: cookie-without-httponly
    severity: low
    description: Set-Cookie without HttpOnly — a session cookie readable from JavaScript (XSS can steal it).
    header: set-cookie
    value_missing_regex: "httponly"
