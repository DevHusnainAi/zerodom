# ZeroDOM community rule pack — secrets exposed in the DOM.
# A field that ARRIVES carrying a credential value is a leak the client can read
# or tamper with. Deterministic, client-side, never sends a request.
#
#   zerodom scan <url> --rules surfaces/secrets.yaml
#
# Match-key reference: the header of zerodom/surfaces.yaml. An unknown key is a
# load-time error (a typo that never fires is the worst outcome), so a pack that
# loads is a pack that works.
rules:
  - id: aws-access-key-in-value
    severity: high
    description: A field arrives holding an AWS access key id (AKIA…) — a secret leaked into the DOM.
    match:
      value_regex: "AKIA[0-9A-Z]{16}"

  - id: google-api-key-in-value
    severity: high
    description: A field arrives holding a Google API key (AIza…).
    match:
      value_regex: "AIza[0-9A-Za-z_-]{35}"

  - id: stripe-live-key-in-value
    severity: high
    description: A field arrives holding a live Stripe secret key (sk_live_…).
    match:
      value_regex: "sk_live_[0-9A-Za-z]{10,}"

  - id: jwt-in-value
    severity: high
    description: A field arrives holding a JWT — a session/bearer token exposed in the DOM.
    match:
      value_regex: "eyJ[A-Za-z0-9_-]{8,}\\.eyJ[A-Za-z0-9_-]{8,}\\."

  - id: bearer-token-in-value
    severity: high
    description: A field arrives holding a Bearer token value.
    match:
      value_regex: "[Bb]earer\\s+[A-Za-z0-9._-]{16,}"

  - id: private-key-in-value
    severity: high
    description: A field arrives holding a PEM private key block.
    match:
      value_regex: "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY"
