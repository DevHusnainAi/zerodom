<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="zerodom">
  <title>zerodom</title>
  <!-- The DOM: many undifferentiated nodes, thinning out. -->
  <g fill="#8b949e">
    <circle cx="10" cy="10" r="3"/><circle cx="22" cy="10" r="3"/>
    <circle cx="34" cy="10" r="3"/><circle cx="46" cy="10" r="3"/>
    <circle cx="10" cy="22" r="3"/><circle cx="22" cy="22" r="3"/>
    <circle cx="34" cy="22" r="3"/>
    <circle cx="10" cy="34" r="3"/><circle cx="22" cy="34" r="3"/>
    <circle cx="10" cy="46" r="3"/>
  </g>
  <!-- The interaction graph: what is left once the rest is pruned. -->
  <g fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round">
    <path d="M34 46 L52 34 M34 46 L52 56"/>
  </g>
  <g fill="#16a34a">
    <circle cx="34" cy="46" r="5.5"/>
    <circle cx="53" cy="33" r="4.5"/>
    <circle cx="53" cy="57" r="4.5"/>
  </g>
</svg>
