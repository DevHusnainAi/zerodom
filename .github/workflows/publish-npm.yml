name: Publish npm

on:
  push:
    # A separate prefix from the PyPI release's `v*`: the two packages version
    # independently, and a single `v*` tag was firing both workflows, failing
    # the PyPI one whenever pyproject.toml wasn't at the same number.
    tags: ["npm-v*"]

permissions:
  contents: read
  id-token: write   # OIDC — no npm token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          want="${GITHUB_REF_NAME#npm-v}"
          got=$(grep -m1 '"version"' package.json | cut -d'"' -f4)
          [ "$want" = "$got" ] || { echo "tag $want != package.json $got"; exit 1; }
      - run: npm ci
      - run: npm run build
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22's bundled npm (10.x)
      # silently skips the OIDC flow and attempts an unauthenticated publish,
      # which the registry 404s instead of clearly rejecting.
      - run: npm install -g npm@latest
      # --provenance requires a public source repo (npm verifies the sigstore
      # bundle against it) — this repo is still private pre-launch. Add it back
      # once DevHusnainAi/zerodom goes public.
      - run: npm publish --access public
