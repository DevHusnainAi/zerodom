name: Release

# Tags, not every push to main: PyPI rejects a re-upload of an existing version,
# so `git tag v0.0.2 && git push --tags` is the publish button.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Job-level permissions REPLACE the workflow-level block rather than merging
      # with it, so contents:read has to be repeated here or checkout 404s on a
      # private repo.
      contents: read
      id-token: write # mints the OIDC token PyPI trusts instead of an API key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Without this, tagging v0.0.2 while pyproject still says 0.0.1 publishes
      # 0.0.1 under the wrong name — and PyPI versions cannot be reused.
      - name: Tag matches pyproject version
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ "$want" = "$got" ] || { echo "tag $want != pyproject $got"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The unpacked Chrome extension as a zip on the GitHub release, with a checksum,
  # for anyone who wants it without pip. Same tag, so the zip always matches the
  # PyPI version's relay protocol.
  extension-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the asset
    steps:
      - uses: actions/checkout@v4
      - name: Zip and checksum the extension
        run: |
          zip -r "zerodom-extension-${GITHUB_REF_NAME}.zip" extension
          sha256sum "zerodom-extension-${GITHUB_REF_NAME}.zip" > "zerodom-extension-${GITHUB_REF_NAME}.zip.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(zerodom-extension-"${GITHUB_REF_NAME}".zip*)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber \
            || gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
